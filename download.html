<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Launcher herunterladen</title>
<style>body{background:#111;color:#fff;font:18px system-ui;text-align:center;padding:40px 20px}img{width:120px;border-radius:24px}a{color:#ddd}</style>
<img src="logo.png" alt="Easy Launcher">
<h1>Easy Launcher</h1>
<p id="status" role="status">Die aktuelle APK wird ermittelt …</p>
<p><a id="download" hidden>APK herunterladen</a></p>
<script>
fetch('update.json', {cache:'no-store'})
  .then(response => { if (!response.ok) throw Error(); return response.json(); })
  .then(manifest => {
    if (!Number.isInteger(manifest.versionCode) || manifest.versionCode < 1) throw Error();
    const expected = `https://github.com/parip69/EasyLauncher-Download/releases/download/v${manifest.versionCode}/EasyLauncher-v${manifest.versionCode}.apk`;
    if (manifest.apkUrl !== expected) throw Error();
    const link = document.getElementById('download');
    link.href = expected;
    link.hidden = false;
    document.getElementById('status').textContent = 'Der Download startet. Falls nötig, tippe auf „APK herunterladen“.';
    window.location.replace(expected);
  }).catch(() => {
    document.getElementById('status').textContent = 'Die aktuelle APK konnte nicht ermittelt werden. Bitte prüfe die Internetverbindung und lade die Seite erneut.';
  });
</script>
</html>
